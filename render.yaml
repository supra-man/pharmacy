services:
  - type: web
    name: pharmacy-app
    runtime: docker
    plan: starter
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacy-app-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "5"

databases:
  - name: pharmacy-app-db
    plan: basic-256mb
    diskSizeGB: 1
